# Reverse proxy for the JupyterHub container deployment service.
#
# The service runs under gunicorn on 127.0.0.1:5000. This server block publishes it on a
# dedicated hostname at the site root, and forwards the host, client, and scheme headers
# that the application's ProxyFix middleware reads. Serving at the root keeps the login
# redirect and the dashboard's relative URLs correct.
#
# Set server_name for the host, and add the TLS server block and its certificate. The
# service sets an HttpOnly cookie, so serve it over HTTPS in production.

server {
    listen 80;
    server_name jupyterhub-deploy.example.org;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 1m;
    }
}
