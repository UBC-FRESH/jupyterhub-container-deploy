# Reverse proxy for the JupyterHub container deployment dashboard.
#
# The service runs under gunicorn on 127.0.0.1:5000. This server block publishes it
# under a URL prefix and forwards the host and scheme headers that the application's
# ProxyFix middleware reads. Adjust server_name, the port, and the prefix for the host.

server {
    listen 80;
    server_name _;

    location /jupyterhub-container-deploy/ {
        proxy_pass http://127.0.0.1:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
